# Shared cargo-deny configuration for the Identity Release repos.
# Applies to pqc-kem, pqc-sig, aethel-core (aethel-docs has no Cargo.toml — not a crate).
# Run with: cargo deny --config <path-to-this-file> check
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
# Deliberately scans the full opt-in surface, not just the default build — including gated
# algorithms behind non-default features (HQC, Classic McEliece, fndsa/Falcon per D2 and the
# BIKE pattern). A crate you can enable is a crate whose advisories you should already know
# about before you enable it, not after. See P1-06-cargo-deny-results.md for what this
# surfaces and why the accepted findings don't block a default build.
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with the initiative's own posture (MIT OR Apache-2.0 for the
# PQC crates, Apache-2.0 for aethel-core per charter D1). Anything not on this list fails the
# check rather than being silently allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
